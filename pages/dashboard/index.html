<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FANBOX 推送面板</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="orbs" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="topbar" id="topbar">
  <div class="veil" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><b></b></div>
  <div class="wrap topbar-in">
    <div class="brand enter"><span class="brand-mark" aria-hidden="true">FB</span><div><h1>FANBOX 推送面板</h1><p id="brandSub">astrbot_plugin_fanbox</p></div></div>
    <div class="top-actions enter" style="animation-delay:80ms">
      <button class="btn sm ghost" id="refreshBtn" type="button" title="立即刷新面板数据">刷新</button>
      <div class="live" id="live" aria-live="polite"><span class="ring" aria-hidden="true"><svg viewBox="0 0 20 20"><circle class="bg" cx="10" cy="10" r="8"/><circle class="fg" id="ringFg" cx="10" cy="10" r="8"/></svg><span class="dot"></span></span><span id="liveText">连接中…</span></div>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <section class="hero card rv enter" aria-label="推送概览">
    <div class="hero-main">
      <span class="eyebrow">近 24 小时推送</span>
      <div class="hero-num sk" id="heroNum" data-v="0">00000</div>
      <div class="hero-meta" id="heroMeta">&nbsp;</div>
      <div class="spark-box" aria-hidden="true">
        <svg class="spark" id="spark" viewBox="0 0 300 60" preserveAspectRatio="none">
          <defs><linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a9cf0" stop-opacity=".22"/><stop offset="1" stop-color="#4a9cf0" stop-opacity="0"/></linearGradient></defs>
          <path class="area" id="sparkArea" d=""/><path class="line" id="sparkLine" d=""/>
        </svg>
        <span class="spark-dot" id="sparkDot"><i></i></span>
      </div>
    </div>
    <div class="tiles" id="tiles"></div>
  </section>

  <div class="section-head rv enter" style="animation-delay:140ms">
    <div class="lead"><h2>创作者</h2><span class="hint" id="creatorHint">每 30 秒自动刷新</span></div>
    <div class="actions">
      <button class="btn sm" id="addToggle" type="button">添加订阅</button>
      <button class="btn sm primary" id="checkBtn" type="button">立即检查</button>
    </div>
  </div>
  <section class="card panel rv" id="addPanel" hidden aria-label="添加订阅">
    <h3>添加订阅</h3>
    <span class="hint">和在 QQ 里发 /fanbox关注 一样，按当前的推送起点开始推送。</span>
    <form class="form-row" id="addForm" autocomplete="off">
      <label class="field"><span>创作者 ID 或主页链接</span><input class="input mono" id="addCreator" placeholder="例如 official 或 https://official.fanbox.cc" required></label>
      <div class="field"><span>推送到</span>
        <div class="row"><select class="select" id="addSession"></select><input class="input mono" id="addQQ" placeholder="QQ 号" hidden inputmode="numeric"></div>
      </div>
      <button class="btn primary" id="addSubmit" type="submit" style="height:36px">订阅</button>
    </form>
  </section>
  <section id="creators" aria-label="创作者">
    <div class="card ghost" aria-hidden="true"><div class="g1"><span class="sk g-av"></span><span class="sk g-t"></span></div><span class="sk g-b"></span><span class="sk g-c"></span></div>
  </section>

  <div class="section-head rv enter" style="animation-delay:200ms"><h2>推送记录</h2><span class="hint" id="pushHint">最近推送到 QQ 的帖子</span></div>
  <section class="card errs enter" id="pushes" aria-label="推送记录" style="animation-delay:240ms">
    <div class="err-ghost" aria-hidden="true"><span class="sk"></span><span class="sk"></span></div>
  </section>

  <div class="section-head rv enter" style="animation-delay:260ms"><h2>最近报错</h2><span class="hint" id="errHint">FANBOX 返回的原因和插件的处理结果</span></div>
  <section class="card errs enter" id="errors" aria-label="最近报错" style="animation-delay:300ms">
    <div class="err-ghost" aria-hidden="true"><span class="sk"></span><span class="sk"></span></div>
  </section>

  <div class="section-head rv enter" style="animation-delay:320ms"><h2>设置</h2><span class="hint" id="setHint">全部设置都能在这里改，保存后立即生效，不用重启</span></div>
  <section class="settings" id="settings" aria-label="设置">
    <div class="card ghost" aria-hidden="true"><div class="g1"><span class="sk g-av"></span><span class="sk g-t"></span></div><span class="sk g-b"></span></div>
  </section>
  <footer class="rv" id="foot"></footer>
</main>

<div class="savebar" id="savebar" role="region" aria-label="未保存的修改">
  <span>有 <b id="dirtyCount">0</b> 项修改还没保存</span>
  <button class="btn sm ghost" id="discardBtn" type="button">撤销</button>
  <button class="btn sm primary" id="saveBtn" type="button">保存并生效</button>
</div>
<div class="tip" id="tip" role="tooltip"></div>
<div class="toast" id="toast" role="status"></div>
<!-- AstrBot 会把这个地址换成带令牌的桥接脚本；必须放在 app.js 前面，否则页面脚本运行时还没有 window.AstrBotPluginPage -->
<script src="/api/plugin/page/bridge-sdk.js"></script>
<script src="./app.js"></script>
</body>
</html>
